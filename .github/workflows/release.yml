name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phar
          coverage: none
      - name: Composer metadata
        run: composer validate --no-check-publish
      - name: PHP syntax
        run: find src examples -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build distributions
        run: php -d phar.readonly=0 tools/build.php
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/release/* --clobber
